[project]
name = "personaprobe"
version = "0.1.0"
description = "Measuring how much of an AI-welfare signal survives persona intervention"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7",
    "transformers>=5.0",
    "accelerate",
    "scipy",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "seaborn",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
